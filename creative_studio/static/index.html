<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作流水线 · 独立测试版</title><link rel="stylesheet" href="/style.css"></head><body><header><div><small>FISHFLEET · 独立测试版</small><h1>视频创作流水线</h1><p>一个话题，多套创意。先生成、逐条审核，再安排发布。</p></div><span class="badge">测试版 · 不会自动发布</span></header><main><section class="card"><h2><b>01</b> 创建创作项目</h2><form id="form"><label>创作话题<textarea name="topic" required maxlength="2000" placeholder="例如：雨后的城市，记录街角的温暖瞬间"></textarea></label><div class="row"><label>参考图片<input name="reference" type="file" accept="image/jpeg,image/png,image/webp" required></label><label>视频数量<input name="count" type="number" min="1" max="20" value="3" required></label><label>视频时长（秒）<input name="duration" type="number" min="5" max="15" value="5" required></label></div><button class="primary">创建项目</button></form><p class="hint">参考图用于提示词理解及视频生成，最多 10MB。支持 1–20 条，视频 5–15 秒。</p></section><section class="card"><h2><b>02</b> 创意提示词 <span id="project-id"></span></h2><p>生成后可逐条修改。生成服务会读取参考图，确认提示词后才提交视频。</p><div class="actions"><button id="prompts" disabled>生成不同提示词</button><button id="generate" class="primary" disabled>确认提示词并生成视频</button></div><div id="items" class="items"><div class="empty">创建项目后开始</div></div></section><section class="card"><h2><b>03</b> 分配发布计划</h2><p>仅审核通过的视频可分配。可以将同一个视频指定给多台手机；计划只保存，不会发布。</p><div class="actions"><button id="devices">刷新在线手机</button><button id="random">随机分配已审核视频</button><button id="save-plan">保存计划</button></div><div id="assignment" class="items"><div class="empty">请先逐条审核视频</div></div><div id="plan-status"></div></section></main><div id="status" role="status"></div><script src="/app.js"></script></body></html>
